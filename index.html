<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>數字順序記憶 Number Flash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --brown:#6b3a22;
  --cell:80px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--brown);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}

/* ---------- Background ---------- */
.sky{position:fixed;inset:0;background:linear-gradient(180deg,#a9d4f5 0%,#cfe8fa 45%,#e9f5fd 100%);overflow:hidden;z-index:0}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:180%;left:12%;bottom:20%}
.cloud::after{width:40%;height:140%;right:12%;bottom:25%}
.c1{width:220px;height:60px;left:4%;top:58%;opacity:.7}
.c2{width:300px;height:80px;right:-40px;top:52%;opacity:.75}
.c3{width:160px;height:44px;left:30%;top:12%;opacity:.5;animation:drift 40s linear infinite}
.c4{width:130px;height:36px;right:22%;top:30%;opacity:.45;animation:drift 55s linear infinite reverse}
@keyframes drift{0%{transform:translateX(-60px)}50%{transform:translateX(60px)}100%{transform:translateX(-60px)}}
.puff{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fffaf0,#fde9cf);box-shadow:0 -3px 0 #ecc9a0}
.hill{position:absolute;left:18%;right:18%;bottom:-14vh;height:28vh;border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#a9dc72,#74bd45 70%);box-shadow:inset 0 6px 0 #8fcf5b}

/* ---------- App layout ---------- */
#app{position:fixed;inset:0;z-index:1;display:grid;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"title title" "lvl right" "board board" "status status" "actions actions";
  gap:6px 10px}
.titlebox{grid-area:title;display:flex;align-items:center;justify-content:center;gap:6px}
.lvl{grid-area:lvl;display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(20px,5.5vw,30px);color:var(--brown)}
.lvl .star{height:1.9em;width:auto;filter:drop-shadow(0 3px 0 rgba(160,90,0,.2))}
.right{grid-area:right;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.boardwrap{grid-area:board;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.status{grid-area:status;text-align:center;font-weight:900;font-size:clamp(16px,4.2vw,22px);min-height:2.2em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#5a3a8a;text-shadow:0 2px 0 #fff}
.actions{grid-area:actions;display:flex;gap:12px;justify-content:center;align-items:center}

@media (min-width:860px) and (orientation:landscape){
  #app{grid-template-columns:minmax(230px,1fr) minmax(0,2.4fr) minmax(230px,1fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"lvl title right" ". board ." ". status actions";gap:8px 18px;padding:22px 28px}
  .lvl{align-self:start;font-size:clamp(28px,3vw,44px)}
  .right{flex-direction:column;align-items:flex-end;align-self:start}
  .actions{justify-content:flex-end;align-self:end}
  .status{align-self:center}
  .btn{font-size:clamp(20px,2vw,32px)}
  .imgbtn img{height:clamp(64px,8vw,96px)}
  .mascot{height:clamp(110px,11vw,160px)}
}
.lvl .imgbtn{position:relative;border:none;background:none;padding:0;line-height:0;transition:transform .1s,filter .2s}
.imgbtn img{height:clamp(56px,13vw,92px);width:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.imgbtn:active{transform:translateY(4px) scale(.97)}
.imgbtn:disabled{filter:grayscale(.85) opacity(.55);cursor:default}
.imgbtn:disabled:active{transform:none}
.imgbtn .badge{position:absolute;top:-4px;right:-4px;line-height:1;min-width:1.6em;padding:.25em .4em;border-radius:99px;background:#f0507a;color:#fff;border:3px solid #fff;font-family:"Baloo 2",var(--font);font-weight:800;font-size:clamp(13px,3vw,18px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.iconbtn{margin-left:auto;font-size:20px;width:44px;height:44px}
@media (min-width:860px) and (orientation:landscape){.lvl .imgbtn{position:relative;border:none;background:none;padding:0;line-height:0;transition:transform .1s,filter .2s}
.imgbtn img{height:clamp(56px,13vw,92px);width:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.imgbtn:active{transform:translateY(4px) scale(.97)}
.imgbtn:disabled{filter:grayscale(.85) opacity(.55);cursor:default}
.imgbtn:disabled:active{transform:none}
.imgbtn .badge{position:absolute;top:-4px;right:-4px;line-height:1;min-width:1.6em;padding:.25em .4em;border-radius:99px;background:#f0507a;color:#fff;border:3px solid #fff;font-family:"Baloo 2",var(--font);font-weight:800;font-size:clamp(13px,3vw,18px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.iconbtn{margin-left:10px}}

/* ---------- Title ---------- */
.mascot{height:clamp(64px,17vw,128px);width:auto;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08));animation:bob 3.4s ease-in-out infinite;transform-origin:bottom}
.title{font-family:"Noto Sans TC",var(--font);font-weight:900;font-size:clamp(34px,10vw,72px);letter-spacing:.02em;line-height:1.05;white-space:nowrap}
.title span{display:inline-block;
  text-shadow:
   0 0 0 #fff,
   3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,
   3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,
   5px 0 0 #fff,-5px 0 0 #fff,0 5px 0 #fff,0 -5px 0 #fff,
   4px 4px 0 #fff,-4px 4px 0 #fff,4px -4px 0 #fff,-4px -4px 0 #fff,
   0 9px 0 rgba(90,60,140,.22);
  animation:bob 3s ease-in-out infinite}
.title span:nth-child(1){color:#f0507a;animation-delay:0s}
.title span:nth-child(2){color:#5cc43a;animation-delay:.2s}
.title span:nth-child(3){color:#2ea7ee;animation-delay:.4s}
.title span:nth-child(4){color:#a65be0;animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- Hearts & score ---------- */
.hearts{display:flex;gap:4px}
.heart{width:clamp(38px,9.5vw,72px);height:auto;transition:transform .3s;filter:drop-shadow(0 3px 2px rgba(150,30,50,.18))}
.heart.lost{animation:breakHeart .5s ease}
@keyframes breakHeart{0%{transform:scale(1.3) rotate(-8deg)}40%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}
.score{position:relative;padding:.35em 1em .3em;font-weight:800;font-size:clamp(18px,4.6vw,34px);color:#22487a;white-space:nowrap;
  background:linear-gradient(180deg,#e6f6ff,#a9dcff);border-radius:999px;border:3px solid #fff;
  box-shadow:0 5px 0 #7fbbe6,0 8px 14px rgba(40,100,160,.2),inset 0 3px 0 rgba(255,255,255,.9)}
.score::before,.score::after{content:"";position:absolute;background:inherit;border:3px solid #fff;border-bottom:none;border-radius:50% 50% 0 0;z-index:-1}
.score::before{width:34%;height:70%;left:14%;top:-32%}
.score::after{width:26%;height:56%;right:16%;top:-24%}
.score b{font-family:"Baloo 2",var(--font)}
.score.bump{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.12)}}

/* ---------- Board ---------- */
.board{--gap:calc(var(--cell)*.14);display:grid;gap:var(--gap);padding:calc(var(--cell)*.32);border-radius:calc(var(--cell)*.4);
  background:linear-gradient(160deg,rgba(255,200,225,.55),rgba(225,190,255,.5));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 10px 30px rgba(120,80,170,.15);
  transition:filter .2s}
.board.paused{filter:blur(10px) saturate(.6)}
.slot{width:var(--cell);height:var(--cell);border-radius:24%;background:rgba(255,255,255,.22);box-shadow:inset 0 2px 6px rgba(150,100,190,.15);position:relative}
.tile{position:absolute;inset:0;border-radius:24%;display:flex;align-items:center;justify-content:center;
  font-family:"Baloo 2",var(--font);font-weight:800;font-size:calc(var(--cell)*.56);line-height:1;
  border:calc(var(--cell)*.05) solid #fff;cursor:pointer;
  --top:#df9ef8;--bot:#a656e6;--edge:#7a34b5;--ink:#6a2b93;
  background:linear-gradient(180deg,var(--top),var(--bot));
  box-shadow:0 calc(var(--cell)*.06) 0 rgba(90,40,130,.25),inset 0 calc(var(--cell)*-.07) 0 var(--edge),inset 0 calc(var(--cell)*.05) calc(var(--cell)*.08) rgba(255,255,255,.5);
  color:#fff;transition:transform .12s;touch-action:manipulation}
.tile.pink{--top:#ffa9cf;--bot:#ef5f9e;--edge:#c13a78;--ink:#9a2459}
.tile::before{content:"";position:absolute;left:12%;top:9%;width:30%;height:16%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-18deg);pointer-events:none}
.tile::after{content:"";position:absolute;right:16%;bottom:16%;width:9%;height:9%;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
.tile:active{transform:scale(.94)}
.tile .num{position:relative;color:#fff;
  text-shadow:0 0 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 rgba(0,0,0,.2)}
.tile .q{position:relative;color:var(--ink);opacity:.85;font-size:.95em}
.tile.done{--top:#a8ea74;--bot:#4db53a;--edge:#2f8a25;--ink:#1f6b1a;cursor:default}
.tile.done .check{position:absolute;right:-6%;bottom:-8%;width:46%;height:46%}
.tile.wrong{--top:#ff9c9c;--bot:#e84545;--edge:#b51f2c;--ink:#8a1020;animation:shake .45s ease}
.tile.reveal{opacity:.55;filter:saturate(.7)}
.tile.reveal .num{font-size:1em}
.tile.hint{animation:glow .7s ease}
.tile.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1) both}
.tile.flip{animation:flip .2s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12%)}40%{transform:translateX(10%)}60%{transform:translateX(-7%)}80%{transform:translateX(4%)}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(.9)}100%{transform:rotateY(0)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,220,60,0)}50%{box-shadow:0 0 0 calc(var(--cell)*.12) rgba(255,220,60,.9)}}

/* ---------- Timer bar ---------- */
.bar{width:min(320px,70vw);height:14px;border-radius:99px;background:rgba(255,255,255,.7);box-shadow:inset 0 2px 3px rgba(0,0,0,.12);overflow:hidden;border:2px solid #fff}
.bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#ffd94a,#ff8a3d)}

/* ---------- Buttons ---------- */
.btn{white-space:nowrap;border:4px solid #fff;border-radius:22px;padding:.35em 1.1em;font-weight:900;font-size:clamp(20px,5vw,34px);font-family:"Noto Sans TC",var(--font);
  color:#6b3a10;background:linear-gradient(180deg,#ffe866,#f7b21c);
  box-shadow:0 6px 0 #d18512,0 10px 16px rgba(160,90,0,.25),inset 0 4px 0 rgba(255,255,255,.6);transition:transform .1s,box-shadow .1s;position:relative}
.btn::before{content:"";position:absolute;left:10%;top:12%;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.7)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d18512,inset 0 4px 0 rgba(255,255,255,.6)}
.btn.orange{color:#fff;background:linear-gradient(180deg,#ffb45a,#f2672a);box-shadow:0 6px 0 #c2471a,0 10px 16px rgba(160,60,0,.25),inset 0 4px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 #b8481a}
.btn.green{color:#fff;background:linear-gradient(180deg,#9ee668,#43ad35);box-shadow:0 6px 0 #2c8424,0 10px 16px rgba(30,110,20,.25),inset 0 4px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 #2c7a22}
.btn.purple{color:#fff;background:linear-gradient(180deg,#d99af7,#9c4fe0);box-shadow:0 6px 0 #6f2fae,0 10px 16px rgba(90,30,140,.25),inset 0 4px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 #6a2aa5}
.btn.small{font-size:clamp(16px,4vw,22px);padding:.3em .8em;border-radius:16px}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.btn .badge{font-size:.6em;vertical-align:middle;background:#fff;color:#e2541f;border-radius:99px;padding:0 .45em;margin-left:.3em;text-shadow:none}
.imgbtn{position:relative;border:none;background:none;padding:0;line-height:0;transition:transform .1s,filter .2s}
.imgbtn img{height:clamp(56px,13vw,92px);width:auto;display:block;pointer-events:none;-webkit-user-drag:none}
.imgbtn:active{transform:translateY(4px) scale(.97)}
.imgbtn:disabled{filter:grayscale(.85) opacity(.55);cursor:default}
.imgbtn:disabled:active{transform:none}
.imgbtn .badge{position:absolute;top:-4px;right:-4px;line-height:1;min-width:1.6em;padding:.25em .4em;border-radius:99px;background:#f0507a;color:#fff;border:3px solid #fff;font-family:"Baloo 2",var(--font);font-weight:800;font-size:clamp(13px,3vw,18px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.iconbtn{width:clamp(44px,10vw,56px);height:clamp(44px,10vw,56px);border-radius:50%;border:3px solid #fff;background:linear-gradient(180deg,#e6f6ff,#a9dcff);box-shadow:0 4px 0 #7fbbe6;font-size:clamp(20px,5vw,26px);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7fbbe6}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(120,170,220,.35);backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.card{width:min(520px,100%);max-height:100%;overflow:auto;background:#fffdf8;border:5px solid #fff;border-radius:32px;padding:24px 22px;text-align:center;
  box-shadow:0 0 0 4px #f6c8e0,0 18px 40px rgba(90,60,150,.28);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.card h2{margin:.1em 0 .2em;font-family:"Noto Sans TC",var(--font);font-weight:900;font-size:clamp(30px,8vw,44px);color:#f0507a;text-shadow:0 3px 0 #ffd6e4}
.card p{margin:.4em 0;font-weight:700;font-size:17px;color:#7a5a4a;line-height:1.55}
.card .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.mode{border:4px solid #fff;border-radius:24px;padding:14px 10px;text-align:center;cursor:pointer;color:#fff;font-family:inherit;
  box-shadow:0 6px 0 var(--sh),0 10px 18px rgba(0,0,0,.12),inset 0 4px 0 rgba(255,255,255,.45)}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.mode.classic{background:linear-gradient(180deg,#d99af7,#9c4fe0);--sh:#6f2fae}
.mode.timed{background:linear-gradient(180deg,#ffa9cf,#ec5596);--sh:#b5306d}
.mode .mt{display:block;font-family:"Noto Sans TC",var(--font);font-weight:900;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.mode .md{display:block;font-weight:700;font-size:14px;opacity:.95;margin-top:4px;line-height:1.4}
.mode .mb{display:inline-block;margin-top:8px;background:rgba(255,255,255,.9);color:#7a3a9a;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:800}
.mode.timed .mb{color:#b5306d}
.how{background:#f4f9ff;border-radius:18px;padding:10px 14px;text-align:left;font-size:15px;font-weight:700;color:#4a6080;line-height:1.6;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:#f4f9ff;border-radius:18px;padding:10px 4px}
.stat small{display:block;font-size:13px;font-weight:700;color:#7a8aa0}
.stat b{display:block;font-family:"Baloo 2",var(--font);font-size:28px;color:#22487a;line-height:1.2}
.rank{display:inline-block;margin:6px 0;padding:8px 20px;border-radius:99px;font-family:"Noto Sans TC",var(--font);font-weight:900;font-size:clamp(22px,6vw,30px);color:#fff;
  background:linear-gradient(180deg,#ffb45a,#f2672a);border:4px solid #fff;box-shadow:0 5px 0 #c2471a;text-shadow:0 2px 0 #b8481a}
.newrec{display:inline-block;margin-left:6px;font-size:14px;color:#fff;background:#f0507a;border-radius:99px;padding:2px 10px;vertical-align:middle;animation:bob 1s infinite}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 16px;text-align:left;max-width:300px;margin:10px auto 0;font-weight:700;font-size:17px;color:#6a5a7a}
.breakdown b{font-family:"Baloo 2",var(--font);text-align:right;color:#22487a}
.breakdown .tot{border-top:2px dashed #e5d5f0;padding-top:6px;color:#f0507a;font-size:20px}

/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.spark{position:absolute;font-size:22px;color:#ffd23a;text-shadow:0 0 2px #fff,0 2px 0 #e6a800;animation:spark .7s ease-out forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(160deg);opacity:0}}
.floattext{position:absolute;transform:translate(-50%,-50%);font-family:"Baloo 2",var(--font);font-weight:800;font-size:26px;color:#fff;text-shadow:0 0 0 #2f8a25,2px 2px 0 #2f8a25,-2px 2px 0 #2f8a25,2px -2px 0 #2f8a25,-2px -2px 0 #2f8a25;animation:floatup .9s ease-out forwards}
@keyframes floatup{to{transform:translate(-50%,-160%);opacity:0}}
.hidden{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b7d"/><stop offset="1" stop-color="#d81e3a"/></linearGradient>
    <linearGradient id="gHeartLost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48f8f"/><stop offset="1" stop-color="#8a6464"/></linearGradient>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
  </defs>
</svg>

<div class="sky" aria-hidden="true">
  <div class="cloud c3"></div><div class="cloud c4"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hill"></div>
  <div class="puff" style="width:34vw;height:34vw;left:-12vw;bottom:-22vw"></div>
  <div class="puff" style="width:22vw;height:22vw;left:12vw;bottom:-14vw"></div>
  <div class="puff" style="width:30vw;height:30vw;right:-10vw;bottom:-20vw"></div>
  <div class="puff" style="width:20vw;height:20vw;right:14vw;bottom:-13vw"></div>
</div>

<div id="app">
  <div class="lvl">
    <img class="star" src="assets/star.webp" alt="">
    <span>關卡 <b id="lvlNum">1</b></span>
    <button class="iconbtn" id="btnMute" aria-label="音效開關">🔊</button>
  </div>
  <div class="titlebox">
    <img class="mascot" src="assets/girl.webp" alt="">
    <div class="title" aria-label="數字順序"><span>數</span><span>字</span><span>順</span><span>序</span></div>
  </div>
  <div class="right">
    <div class="hearts" id="hearts"></div>
    <div class="score" id="scoreBox">分數: <b id="score">0</b></div>
  </div>
  <div class="boardwrap" id="boardWrap"><div class="board" id="board"></div></div>
  <div class="status" id="status"></div>
  <div class="actions">
    <button class="btn green hidden" id="btnStart">開始</button>
    <button class="imgbtn" id="btnPause" aria-label="暫停"><img src="assets/btnpause.webp" alt="暫停"></button>
    <button class="imgbtn" id="btnHint" aria-label="提示"><img src="assets/btnhint.webp" alt="提示"><span class="badge" id="hintBadge">1</span></button>
  </div>
</div>
<div id="fx"></div>

<!-- Start screen -->
<div class="overlay show" id="ovStart">
  <div class="card">
    <img src="assets/girl.webp" alt="" style="height:110px;width:auto;animation:bob 3s ease-in-out infinite">
    <h2>數字順序記憶</h2>
    <p>記住數字的位置，再依照 1 → 2 → 3… 的順序點回來！</p>
    <div class="modes">
      <button class="mode classic" data-mode="classic"><span class="mt">經典模式</span><span class="md">點下 1 的瞬間<br>其他數字立刻蓋起來</span><span class="mb" id="bestClassic">最佳 0 分</span></button>
      <button class="mode timed" data-mode="timed"><span class="mt">限時模式</span><span class="md">倒數幾秒後<br>所有數字一起蓋起來</span><span class="mb" id="bestTimed">最佳 0 分</span></button>
    </div>
    <div class="how">❤️ 共 3 條命，點錯會扣 1 條<br>💡 每關可以用 1 次「提示」，但會失去連擊加成<br>⭐ 越快完成、連續不失誤，分數越高</div>
  </div>
</div>

<!-- Pause -->
<div class="overlay" id="ovPause">
  <div class="card">
    <h2>暫停中</h2>
    <p>休息一下，準備好再繼續！</p>
    <div class="row"><button class="btn green" id="btnResume">繼續</button><button class="btn purple" id="btnQuit">回主選單</button></div>
  </div>
</div>

<!-- Level clear -->
<div class="overlay" id="ovClear">
  <div class="card">
    <img src="assets/star.webp" alt="" style="height:80px;width:auto;animation:bump 1s ease infinite"><h2 id="clearTitle">過關！</h2>
    <div class="breakdown" id="breakdown"></div>
    <div class="row"><button class="btn green" id="btnNext">下一關 ▶</button></div>
  </div>
</div>

<!-- Fail (lives remaining) -->
<div class="overlay" id="ovFail">
  <div class="card">
    <h2 style="color:#e84545;text-shadow:0 3px 0 #ffd0d0">差一點點！</h2>
    <p id="failText">剛剛記錯囉，看看正確的位置吧。</p>
    <div class="row"><button class="btn orange" id="btnRetry">再挑戰本關</button></div>
  </div>
</div>

<!-- Game over -->
<div class="overlay" id="ovOver">
  <div class="card">
    <img src="assets/girl.webp" alt="" style="height:90px;width:auto"><h2>遊戲結束</h2>
    <div><span class="rank" id="rankTitle">金魚腦畢業生</span></div>
    <p id="rankDesc"></p>
    <div class="stats">
      <div class="stat"><small>分數</small><b id="oScore">0</b></div>
      <div class="stat"><small>最高關卡</small><b id="oLevel">1</b></div>
      <div class="stat"><small>記住數字</small><b id="oNums">0</b></div>
    </div>
    <p id="oBest"></p>
    <div class="row"><button class="btn green" id="btnAgain">再玩一次</button><button class="btn purple" id="btnMenu">主選單</button></div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const board = $("board"), boardWrap = $("boardWrap"), statusEl = $("status");

/* ---------- Storage (safe) ---------- */
const STORE_KEY = "numflash-best-v1";
function loadBest(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveBest(b){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(b)); }catch(e){} }
let best = loadBest();
let muted = false; try{ muted = localStorage.getItem("numflash-muted")==="1"; }catch(e){}

/* ---------- Audio ---------- */
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume().catch(()=>{}); return actx; }
function tone(freq, dur=.18, type="triangle", vol=.22, when=0, slideTo=null){
  if(muted) return; const a = ac(); if(!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
const SCALE = [0,2,4,5,7,9,11]; // Do Re Mi Fa Sol La Si
function noteFreq(i){ const oct = Math.floor(i/7), st = SCALE[i%7] + 12*oct; return 523.25 * Math.pow(2, st/12); }
const sfx = {
  correct(i){ tone(noteFreq(i), .2, "triangle", .25); tone(noteFreq(i)*2, .12, "sine", .06); },
  wrong(){ tone(180, .4, "square", .09, 0, 90); tone(120, .45, "sawtooth", .05, .02, 70); },
  flip(){ tone(900, .06, "sine", .06, 0, 500); },
  clear(){ [0,2,4,7].forEach((s,k)=>tone(noteFreq(s+7), .22, "triangle", .2, k*.09)); },
  pop(){ tone(700, .07, "sine", .08, 0, 1100); },
  over(){ [7,4,2,0].forEach((s,k)=>tone(noteFreq(s), .3, "triangle", .18, k*.16)); },
  tick(){ tone(1300, .04, "sine", .05); }
};

/* ---------- SVG bits ---------- */
function heartSVG(alive){
  return `<img class="heart${alive?"":" lost"}" src="assets/${alive?"heart":"heartlost"}.webp" alt="${alive?"愛心":"失去的愛心"}" draggable="false">`;
}
const CHECK_SVG = `<svg class="check" viewBox="0 0 50 50"><path d="M8 26 L20 38 L43 12" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 26 L20 38 L43 12" fill="none" stroke="#3fae2e" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- Level config ---------- */
function levelCfg(lv){
  let cols, rows, t;
  if(lv <= 2){ cols = rows = 3; t = 3.0; }
  else if(lv <= 5){ cols = rows = 4; t = 3.5; }
  else if(lv <= 9){ cols = rows = 5; t = 4.5; }
  else {
    const landscape = boardWrap.clientWidth > boardWrap.clientHeight * 1.1;
    cols = landscape ? 6 : 5; rows = landscape ? 5 : 6; t = 5.0;
  }
  const count = Math.min(lv + 2, cols * rows);
  return {cols, rows, count, time: t};
}

/* Balanced random placement: pick the best of several random layouts */
function placeNumbers(cols, rows, count){
  const total = cols*rows; let bestSet = null, bestScore = Infinity;
  for(let k=0;k<40;k++){
    const idx = [...Array(total).keys()];
    for(let i=idx.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    const pick = idx.slice(0,count);
    const q = [0,0,0,0]; let adj = 0;
    const set = new Set(pick);
    pick.forEach(p=>{
      const r = Math.floor(p/cols), c = p%cols;
      q[((c+.5)/cols < .5 ? 0:1) + ((r+.5)/rows < .5 ? 0:2)]++;
      if(c+1<cols && set.has(p+1)) adj++;
      if(r+1<rows && set.has(p+cols)) adj++;
    });
    const mean = count/4, variance = q.reduce((s,v)=>s+(v-mean)**2,0);
    const score = variance*2 + adj*0.6 + Math.random()*0.5;
    if(score < bestScore){ bestScore = score; bestSet = pick; }
  }
  return bestSet; // index i holds position of number i+1
}

/* ---------- State ---------- */
const S = {
  mode:"classic", level:1, lives:3, score:0, streak:0, maxCleared:0,
  phase:"idle", // idle | ready | memorize | answer | result
  cfg:null, positions:[], tiles:[], next:1, hintUsed:false, mistake:false,
  busy:false, paused:false, answerStart:0, pauseStart:0, pauseAccum:0,
  remain:0, lastTs:0, raf:0, lastTickSec:0
};

/* ---------- Rendering ---------- */
function renderHearts(lostIndex=-1){
  $("hearts").innerHTML = [0,1,2].map(i => heartSVG(i < S.lives)).join("");
  if(lostIndex < 0) [...$("hearts").children].forEach(h=>h.classList.remove("lost"));
  else [...$("hearts").children].forEach((h,i)=>{ if(i!==lostIndex) h.classList.remove("lost"); });
}
function renderScore(bump){
  $("score").textContent = S.score.toLocaleString("en-US");
  if(bump){ const b=$("scoreBox"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
function setStatus(html){ statusEl.innerHTML = html.startsWith("<span") ? html : `<span>${html}</span>`; }

function fit(){
  if(!S.cfg) return;
  const {cols, rows} = S.cfg;
  const w = boardWrap.clientWidth, h = boardWrap.clientHeight;
  const cell = Math.max(28, Math.min(w/(cols*1.14+0.5), h/(rows*1.14+0.5), 128));
  board.style.setProperty("--cell", Math.floor(cell)+"px");
}

function buildBoard(){
  const {cols, rows, count} = S.cfg;
  board.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
  board.innerHTML = "";
  S.tiles = [];
  const posToNum = new Map(S.positions.map((p,i)=>[p,i+1]));
  for(let p=0;p<cols*rows;p++){
    const slot = document.createElement("div"); slot.className = "slot";
    if(posToNum.has(p)){
      const n = posToNum.get(p);
      const t = document.createElement("div");
      t.className = "tile hidden" + (Math.random()<.5 ? " pink" : "");
      t.dataset.n = n; t.setAttribute("role","button");
      t.addEventListener("click", () => onTile(n, t));
      slot.appendChild(t); S.tiles[n] = t;
    }
    board.appendChild(slot);
  }
  fit();
}
function faceNum(t, n){ t.innerHTML = `<span class="num">${n}</span>`; }
function faceQ(t){ t.innerHTML = `<span class="q">?</span>`; }

function showNumbers(){
  for(let n=1;n<=S.cfg.count;n++){
    const t = S.tiles[n]; faceNum(t,n);
    t.classList.remove("hidden"); t.style.animationDelay = (n*0.025)+"s"; t.classList.add("pop");
    setTimeout(()=>{ t.classList.remove("pop"); t.style.animationDelay=""; }, 400 + n*25);
  }
  sfx.pop();
}
function cover(fromN){
  S.busy = true; sfx.flip();
  for(let n=fromN;n<=S.cfg.count;n++){
    const t = S.tiles[n]; t.classList.remove("pop"); t.classList.add("flip");
    setTimeout(()=>faceQ(t), 100);
    setTimeout(()=>t.classList.remove("flip"), 210);
  }
  setTimeout(()=>{ S.busy = false; updateButtons(); }, 220);
}

/* ---------- FX ---------- */
function sparkle(el, text){
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, fx = $("fx");
  for(let i=0;i<7;i++){
    const s = document.createElement("span"); s.className = "spark"; s.textContent = "★";
    const ang = Math.random()*Math.PI*2, d = r.width*(.6+Math.random()*.5);
    s.style.left = cx+"px"; s.style.top = cy+"px";
    s.style.setProperty("--dx", Math.cos(ang)*d+"px"); s.style.setProperty("--dy", Math.sin(ang)*d+"px");
    s.style.fontSize = (14+Math.random()*14)+"px";
    fx.appendChild(s); setTimeout(()=>s.remove(), 750);
  }
  if(text){
    const f = document.createElement("div"); f.className="floattext"; f.textContent=text;
    f.style.left = cx+"px"; f.style.top = (r.top)+"px"; fx.appendChild(f); setTimeout(()=>f.remove(), 950);
  }
}

/* ---------- Flow ---------- */
function show(id){ $(id).classList.add("show"); }
function hide(id){ $(id).classList.remove("show"); }
function hideAll(){ ["ovStart","ovPause","ovClear","ovFail","ovOver"].forEach(hide); }

function updateButtons(){
  const inPlay = ["ready","memorize","answer"].includes(S.phase);
  $("btnPause").disabled = !inPlay;
  $("btnHint").disabled = !(S.phase==="answer" && !S.hintUsed && !S.busy);
  $("hintBadge").textContent = S.hintUsed ? "0" : "1";
  $("btnStart").classList.toggle("hidden", S.phase!=="ready");
  $("btnHint").classList.toggle("hidden", S.phase==="ready");
}

function startGame(mode){
  ac();
  S.mode = mode; S.level = 1; S.lives = 3; S.score = 0; S.streak = 0; S.maxCleared = 0;
  hideAll(); renderHearts(); renderScore(); startLevel();
}

function startLevel(){
  cancelAnimationFrame(S.raf);
  S.cfg = levelCfg(S.level);
  S.positions = placeNumbers(S.cfg.cols, S.cfg.rows, S.cfg.count);
  S.next = 1; S.hintUsed = false; S.mistake = false; S.busy = false; S.paused = false;
  S.pauseAccum = 0; board.classList.remove("paused");
  $("lvlNum").textContent = S.level;
  buildBoard();
  if(S.mode === "classic"){
    S.phase = "memorize"; showNumbers();
    setStatus(`記住 <b>${S.cfg.count}</b> 個數字的位置，點 <b>1</b> 開始！`);
  } else {
    S.phase = "ready";
    setStatus(`第 ${S.level} 關：<b>${S.cfg.count}</b> 個數字，只有 <b>${S.cfg.time.toFixed(1)}</b> 秒記憶時間`);
  }
  updateButtons();
}

function beginCountdown(){
  if(S.phase!=="ready" || S.paused) return;
  ac();
  S.phase = "memorize"; showNumbers(); updateButtons();
  S.remain = S.cfg.time*1000; S.lastTs = performance.now(); S.lastTickSec = Math.ceil(S.cfg.time);
  setStatus(`<span>記住它們！<b id="secs">${S.cfg.time.toFixed(1)}</b> 秒</span><div class="bar"><i id="barFill"></i></div>`);
  const loop = ts => {
    const dt = ts - S.lastTs; S.lastTs = ts;
    if(!S.paused) S.remain -= dt;
    const r = Math.max(0, S.remain);
    const fill = $("barFill"), secs = $("secs");
    if(fill) fill.style.width = (r/(S.cfg.time*1000)*100)+"%";
    if(secs) secs.textContent = (r/1000).toFixed(1);
    const sec = Math.ceil(r/1000); if(sec < S.lastTickSec && sec>0 && !S.paused){ S.lastTickSec = sec; sfx.tick(); }
    if(r <= 0){ cover(1); startAnswer(); return; }
    S.raf = requestAnimationFrame(loop);
  };
  S.raf = requestAnimationFrame(loop);
}

function startAnswer(){
  S.phase = "answer"; S.answerStart = performance.now(); S.pauseAccum = 0;
  setStatus(`依序點出 <b>${S.next}</b> → … → <b>${S.cfg.count}</b>`);
  updateButtons();
}

function onTile(n, t){
  if(S.busy || S.paused) return;
  if(t.classList.contains("done")) return;
  if(S.phase === "memorize" && S.mode === "classic"){
    if(n === 1){
      markDone(t, 1); S.next = 2;
      if(S.cfg.count > 1) cover(2);
      startAnswer();
      if(S.next > S.cfg.count) levelClear();
    } else wrong(n, t);
    return;
  }
  if(S.phase !== "answer") return;
  if(n === S.next){
    markDone(t, n); S.next++;
    if(S.next > S.cfg.count) levelClear();
    else setStatus(`下一個：<b>${S.next}</b>　（${S.next-1} / ${S.cfg.count}）`);
  } else wrong(n, t);
}

function markDone(t, n){
  t.classList.remove("flip","hint","pop");
  t.classList.add("done");
  t.innerHTML = `<span class="num">${n}</span>${CHECK_SVG}`;
  sfx.correct(n-1); sparkle(t);
}

function wrong(n, t){
  S.busy = true; S.phase = "result"; S.mistake = true; S.streak = 0;
  cancelAnimationFrame(S.raf);
  S.lives--;
  t.classList.add("wrong"); faceNum(t, n);
  sfx.wrong();
  if(navigator.vibrate) try{ navigator.vibrate(120); }catch(e){}
  for(let k=1;k<=S.cfg.count;k++){
    const tile = S.tiles[k];
    if(tile===t || tile.classList.contains("done")) continue;
    tile.classList.remove("hidden"); tile.classList.add("reveal"); faceNum(tile, k);
  }
  renderHearts(S.lives);
  setStatus(`應該點 <b>${S.next}</b> 才對喔！`);
  updateButtons();
  setTimeout(()=>{
    if(S.lives > 0){
      $("failText").innerHTML = `你點到了 <b>${n}</b>，正確的是 <b>${S.next}</b>。<br>還剩 ${"❤️".repeat(S.lives)}，再試一次吧！`;
      show("ovFail");
    } else gameOver();
  }, 1700);
}

function levelClear(){
  S.busy = true; S.phase = "result";
  const elapsed = (performance.now() - S.answerStart - S.pauseAccum)/1000;
  const count = S.cfg.count;
  const base = count*100;
  const limit = count*1.2 + 1;
  const timeBonus = Math.max(0, Math.round((limit - elapsed)*40));
  const perfect = !S.mistake && !S.hintUsed;
  if(perfect) S.streak++; else S.streak = 0;
  const combo = perfect ? S.streak*50 : 0;
  const gained = base + timeBonus + combo;
  S.score += gained; S.maxCleared = Math.max(S.maxCleared, count);
  renderScore(true); sfx.clear();
  sparkle(S.tiles[count], "+"+gained);
  updateButtons();
  const titles = ["過關！","太棒了！","好厲害！","記憶力爆發！","完美！"];
  $("clearTitle").textContent = perfect && S.streak>=3 ? `${S.streak} 連擊！` : titles[Math.floor(Math.random()*titles.length)];
  $("breakdown").innerHTML =
    `<span>數字 ${count} 個 × 100</span><b>${base}</b>`+
    `<span>速度加成（${elapsed.toFixed(1)} 秒）</span><b>+${timeBonus}</b>`+
    `<span>無失誤連擊 ${perfect ? "×"+S.streak : (S.hintUsed ? "（用了提示）" : "")}</span><b>+${combo}</b>`+
    `<span class="tot">本關得分</span><b class="tot">${gained}</b>`;
  setTimeout(()=>show("ovClear"), 650);
}

function rankFor(n){
  if(n >= 12) return ["照相記憶大師","你的大腦是一台相機！📸"];
  if(n >= 9)  return ["黑猩猩對手","已經可以跟黑猩猩一較高下了！🐵"];
  if(n >= 5)  return ["金魚腦畢業生","恭喜脫離金魚腦，繼續加油！🐟"];
  return ["暖身中的小腦袋","多玩幾次，記憶力會越來越好喔！🌱"];
}

function gameOver(){
  hideAll(); sfx.over(); S.phase = "idle"; updateButtons();
  const [title, desc] = rankFor(S.maxCleared);
  $("rankTitle").textContent = title; $("rankDesc").textContent = desc;
  $("oScore").textContent = S.score.toLocaleString("en-US");
  $("oLevel").textContent = S.level; $("oNums").textContent = S.maxCleared;
  const b = best[S.mode] || {score:0, level:0, nums:0};
  const isNew = S.score > b.score;
  best[S.mode] = { score: Math.max(b.score, S.score), level: Math.max(b.level, S.level), nums: Math.max(b.nums, S.maxCleared) };
  saveBest(best); refreshBest();
  const mb = best[S.mode];
  $("oBest").innerHTML = (isNew && S.score>0 ? `<span class="newrec">新紀錄！</span><br>` : "") +
    `${S.mode==="classic"?"經典":"限時"}模式最佳：${mb.score.toLocaleString("en-US")} 分 · 第 ${mb.level} 關 · ${mb.nums} 個數字`;
  show("ovOver");
}

function refreshBest(){
  const c = best.classic, t = best.timed;
  $("bestClassic").textContent = c ? `最佳 ${c.score.toLocaleString("en-US")} 分 · 第${c.level}關` : "還沒有紀錄";
  $("bestTimed").textContent = t ? `最佳 ${t.score.toLocaleString("en-US")} 分 · 第${t.level}關` : "還沒有紀錄";
}

/* ---------- Pause / hint ---------- */
function pause(){
  if(S.paused || !["ready","memorize","answer"].includes(S.phase)) return;
  S.paused = true; S.pauseStart = performance.now();
  board.classList.add("paused"); show("ovPause");
}
function resume(){
  if(!S.paused) return;
  S.paused = false; hide("ovPause"); board.classList.remove("paused");
  if(S.phase==="answer") S.pauseAccum += performance.now() - S.pauseStart;
  S.lastTs = performance.now();
}
function hint(){
  if(S.phase!=="answer" || S.hintUsed || S.busy || S.paused) return;
  S.hintUsed = true; S.busy = true;
  const t = S.tiles[S.next], n = S.next;
  faceNum(t, n); t.classList.add("hint"); sfx.pop();
  updateButtons();
  setTimeout(()=>{ if(!t.classList.contains("done")){ faceQ(t); } t.classList.remove("hint"); S.busy = false; updateButtons(); }, 750);
}

/* ---------- Wiring ---------- */
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => startGame(b.dataset.mode)));
$("btnStart").addEventListener("click", beginCountdown);
$("btnPause").addEventListener("click", pause);
$("btnResume").addEventListener("click", resume);
$("btnHint").addEventListener("click", hint);
$("btnNext").addEventListener("click", () => { hide("ovClear"); S.level++; startLevel(); });
$("btnRetry").addEventListener("click", () => { hide("ovFail"); startLevel(); });
$("btnAgain").addEventListener("click", () => startGame(S.mode));
function toMenu(){ cancelAnimationFrame(S.raf); hideAll(); S.phase="idle"; S.paused=false; board.classList.remove("paused"); updateButtons(); refreshBest(); show("ovStart"); }
$("btnMenu").addEventListener("click", toMenu);
$("btnQuit").addEventListener("click", toMenu);
$("btnMute").addEventListener("click", () => {
  muted = !muted; $("btnMute").textContent = muted ? "🔇" : "🔊";
  try{ localStorage.setItem("numflash-muted", muted?"1":"0"); }catch(e){}
  if(!muted){ ac(); sfx.pop(); }
});
$("btnMute").textContent = muted ? "🔇" : "🔊";
document.addEventListener("keydown", e => {
  if(e.key==="Escape" || e.key==="p" || e.key==="P"){ S.paused ? resume() : pause(); }
  else if(e.key==="Enter" || e.key===" "){
    if($("ovClear").classList.contains("show")) $("btnNext").click();
    else if($("ovFail").classList.contains("show")) $("btnRetry").click();
    else if(S.phase==="ready" && !S.paused) beginCountdown();
    e.preventDefault();
  } else if(e.key==="h" || e.key==="H") hint();
});
document.addEventListener("visibilitychange", () => { if(document.hidden) pause(); });
window.addEventListener("resize", fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(boardWrap);

/* Idle preview board behind the start screen */
